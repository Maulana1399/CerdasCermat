; Override DEV untuk OPcache — mengaktifkan validasi timestamp agar
; perubahan PHP/Blade langsung terbaca TANPA rebuild/restart container.
;
; Dimuat sebagai zzz-dev-opcache.ini agar memiliki urutan pengurutan nama
; SETELAH zz-app.ini (opsi yang sama di zz-app.ini akan terbaca JELAS dulu,
; lalu nilai di sini menang karena memuat belakangan dalam conf.d).
; Konfigurasi ini HANYA berlaku saat mode development (compose.dev.yaml
; menempatkan file ini di /usr/local/etc/php/conf.d/). Image produksi tidak
; menyertakannya sehingga tetap memakai validate_timestamps = 0.
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.revalidate_path = 0

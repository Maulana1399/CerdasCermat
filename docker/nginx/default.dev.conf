# Konfigurasi nginx KHUSUS mode DEVELOPMENT (dipakai oleh compose.dev.yaml).
# Identik dengan docker/nginx/default.conf PRODUKSI, KECUALI:
#   - Asset statis (.css/.js/dst.) TIDAK lagi di-cache 30 hari. Dipaksa
#     selalu revalidate: `expires -1` => stale-while-revalidate (browser
#     memvalidasi ulang tiap akses), plus Cache-Control no-store.
# Alasan: selama development public/ diserve dari bind-mount host oleh
# lomba-web, sedangkan `?v=filemtime()` Blade dihitung dari filesystem
# lomba-app (image). Policy ini membuat perbedaan `?v` tidak relevan:
# browser selalu meminta ulang content terbaru tanpa rebuild image.
# Produksi TETAP memakai default.conf (max-age=2592000/30 hari).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/lomba/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 24M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Healthcheck sederhana dari lomba-web.
    location = /up {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass lomba-app:9000;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass lomba-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # DEV: asset selalu revalidate (no cache) — lihat header file.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|map|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        access_log off;
    }
}
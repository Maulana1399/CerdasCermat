# ---------------------------------------------------------------
# Stack Docker khusus "Lomba Cerdas Cermat" — terisolasi dari
# aplikasi lain di VM (network & nama service unik: lomba-*).
#
# PENTING:
#  - Port host default 8082. Sebelum `up`, pastikan tidak bentrok
#    dengan aplikasi lain (audit: `ss -lntp`). Atur lewat
#    environment LOMBA_HTTP_PORT jika perlu.
#  - Data SQLite + storage Laravel dipakai melalui named volume,
#    sehingga aman saat container di-recreate.
#  - BUILD memakai `network: host` (build.network Compose spec):
#    BuildKit pada host ini gagal resolusi DNS deb.debian.org saat
#    memakai sandbox network bawaan, padahal host/container lain PASS.
#    Pengaturan ini HANYA berlaku saat build; runtime tetap memakai
#    network bridge `lomba-network` (lihat bagian services/nets).
#  - Untuk menghubungkan lewat reverse proxy yang sudah ada di host,
#    hilangkan baris `ports` di bawah dan jadikan lomba-web hanya
#    konsumsi network bridge proxy tersebut (lih. report).
# ---------------------------------------------------------------
name: lomba

services:
  lomba-app:
    build:
      context: .
      target: prod
      # HANYA saat build: gunakan network host agar apt-get debian
      # terselesaikan (runtime tetap lomba-network).
      network: host
    container_name: lomba-app
    restart: unless-stopped
    working_dir: /var/www/lomba
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://127.0.0.1:8082}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/lomba/database/database.sqlite
    volumes:
      - lomba-db:/var/www/lomba/database
      - lomba-storage:/var/www/lomba/storage
      - lomba-sounds:/var/www/lomba/storage/app/public/sounds
      - lomba-bootstrap-cache:/var/www/lomba/bootstrap/cache
    expose:
      - "9000"
    networks:
      - lomba-network
    healthcheck:
      # Lindungi: port 9000 adalah FastCGI, bukan HTTP — jangan pakai
      # curl/http ke sini. cgi-fcgi (pkg libfcgi-bin) berbicara FastCGI
      # ke ping.path /ping pada php-fpm (www.conf), respons 'pong'.
      test: ["CMD", "cgi-fcgi", "-bind", "-connect", "127.0.0.1:9000", "/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  lomba-web:
    image: nginx:1.27-alpine
    container_name: lomba-web
    restart: unless-stopped
    depends_on:
      lomba-app:
        condition: service_healthy
    ports:
      - "${LOMBA_HTTP_PORT:-8082}:80"
    volumes:
      - ./:/var/www/lomba:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lomba-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Satu-kali tool (profil "tools") — dipakai untuk menjalankan test
  # Laravel / perintah artisan di dalam container tanpa mengotori
  # image produksi.
  #   docker compose --profile tools run --rm lomba-tools php artisan test
  lomba-tools:
    build:
      context: .
      target: base
      # HANYA saat build: network host (lihat catatan di atas).
      network: host
    profiles: ["tools"]
    container_name: lomba-tools
    working_dir: /var/www/lomba
    env_file:
      - .env.docker
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/lomba/database/database.sqlite
    volumes:
      - lomba-db:/var/www/lomba/database
      - lomba-storage:/var/www/lomba/storage
      - lomba-sounds:/var/www/lomba/storage/app/public/sounds
      - lomba-bootstrap-cache:/var/www/lomba/bootstrap/cache
    networks:
      - lomba-network

networks:
  lomba-network:
    driver: bridge

volumes:
  lomba-db:
  lomba-storage:
  lomba-sounds:
  lomba-bootstrap-cache: